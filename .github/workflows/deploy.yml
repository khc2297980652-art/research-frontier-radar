name: 抓取并发布

# 每 6 小时自动重建一次站点，也可以在 Actions 页面手动触发。
# 注意：GitHub 的定时任务在仓库连续 60 天没有提交后会自动停用，
# 手动跑一次或随便推一个提交即可恢复。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# 只允许一个部署任务同时进行
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 两份缓存都跨次累积：
      # - figures.json   配图源（arXiv），否则每次只抓最新的几十篇
      # - summaries.json LLM 速读结果，同一篇只算一次，控制成本
      - name: 恢复数据缓存
        uses: actions/cache@v4
        with:
          path: |
            data/figures.json
            data/summaries.json
          key: radar-data-${{ github.run_id }}
          # 保留旧的 figures- 前缀，让此前的配图缓存继续可用
          restore-keys: |
            radar-data-
            figures-

      - name: 抓取最新文献
        run: npm run refresh
        env:
          RADAR_MAILTO: ${{ vars.RADAR_MAILTO }}
          # 速读用的大模型密钥：任配其一即可（DeepSeek 优先，更省）。
          # 未配置时该步骤整体跳过，其余数据照常产出。密钥只在 Actions 里，不进代码库。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 导出静态数据并构建
        run: npm run build:static

      # 前置条件：仓库必须在 Settings → Pages 里把 Source 设为 "GitHub Actions"。
      # 曾尝试用 enablement: true 让这步自动完成，实测在该仓库上会失败
      # （Pages 站点需先由仓库所有者手动开通一次），因此改为显式前置依赖。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
